apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '2'
  name: notes-api
  namespace: notes-lab
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: tracing-lab-api:otel-5fc0da89b662d0b6
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: notes-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /readyz
            port: 8000
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 10
        volumeMounts:
        - name: password
          mountPath: /run/secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
        imagePullPolicy: Never
        env:
        - name: OTEL_SERVICE_NAME
          value: notes-api
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=notes-lab,deployment.environment.name=lab
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://collector.tracing-lab.svc.cluster.local:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_TRACES_SAMPLER
          value: parentbased_always_on
      volumes:
      - name: password
        secret:
          secretName: notes-db
          defaultMode: 292
          items:
          - key: password
            path: db_password
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
  namespace: notes-lab
spec:
  type: NodePort
  selector:
    app: notes-api
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30080
